<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krosna · 任务导航原型</title>
<style>
:root{--cs-bg:#edf0f5;--cs-surface:#fff;--cs-ink:#202b3b;--cs-muted:#59677a;--cs-line:#dce2eb;--cs-active:#e4eaf3;--cs-blue:#245bc0;--cs-green:#187443;--cs-amber:#956000;--cs-dark:#243449;--cs-on:#fff}*{box-sizing:border-box}body{margin:0;background:var(--cs-bg);color:var(--cs-ink);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit;border-radius:6px;padding:8px 12px;text-align:left}button:hover{background:var(--cs-active)}button:focus-visible,input:focus-visible{outline:2px solid var(--cs-blue);outline-offset:2px}button[aria-pressed=true]{background:var(--cs-dark);color:var(--cs-on)}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0}p{margin:8px 0}.app-review{padding:20px 28px 16px;background:var(--cs-surface)}.app-heading,.app-meta,.app-top,.app-tabs,.app-status,.app-controls{display:flex;align-items:center;gap:16px}.app-heading{justify-content:space-between}.app-muted,small{color:var(--cs-muted)}.app-options{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.app-options button{border:1px solid var(--cs-line);padding:9px 18px}.app-meta{padding:14px 28px;justify-content:space-between;min-height:76px}.app-meta p{margin:0}.app-tag{color:var(--cs-blue);font-weight:600}.app-window{margin:0 20px 20px;border:1px solid var(--cs-line);border-radius:12px;overflow:hidden;height:calc(100vh - 238px);min-height:540px;background:var(--cs-bg);display:flex;flex-direction:column}.app-top{height:48px;flex-shrink:0;padding:0 18px}.app-brand{font-weight:700;font-size:17px;letter-spacing:-.5px;margin-right:18px}.app-brand span{color:var(--cs-blue)}.app-spacer{flex:1}.app-main{display:flex;min-height:0;flex:1;position:relative}.app-files{width:210px;flex-shrink:0;padding:16px 14px;overflow:auto}.app-files h2{font-size:14px;margin:0 10px 18px}.app-file{padding:7px 10px;color:var(--cs-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.app-file.indent{padding-left:26px}.app-file.selected{background:var(--cs-active);border-radius:6px;color:var(--cs-ink)}.app-work{background:var(--cs-surface);border:1px solid var(--cs-line);border-radius:10px 0 0 0;flex:1;min-width:0;display:flex;flex-direction:column}.app-tabs{gap:0;border-bottom:1px solid var(--cs-line);overflow:hidden;min-height:44px;flex-shrink:0}.app-tabs span{padding:10px 18px;white-space:nowrap;color:var(--cs-muted)}.app-tabs .current{color:var(--cs-ink);border-bottom:2px solid var(--cs-blue)}.app-terminal{padding:28px 34px;overflow:auto;flex:1}.app-terminal h2{margin:16px 0;font-size:19px}.app-prompt{background:var(--cs-bg);padding:12px 16px;border-radius:6px;margin-bottom:26px}.app-terminal p{max-width:850px}.app-terminal table{border-collapse:collapse;width:100%;margin:20px 0}.app-terminal td,.app-terminal th{border-bottom:1px solid var(--cs-line);padding:10px 12px;text-align:left}.app-terminal th{font-weight:500;color:var(--cs-muted)}.app-terminal code{font-family:Consolas,monospace;color:var(--cs-blue)}.app-composer{margin:16px 0 0;padding:14px 0;border-top:1px solid var(--cs-line);color:var(--cs-muted)}.app-status{font-size:12px;padding:5px 18px;min-height:30px;flex-shrink:0}.app-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cs-green);margin-right:7px}.app-dot.wait{background:var(--cs-amber)}.app-task{width:100%;padding:12px;text-align:left;display:block}.app-task strong{display:block;font-weight:500}.app-task small{display:block;margin-top:4px}.app-task.active{background:var(--cs-active)}.app-dock{padding:10px 14px;background:var(--cs-bg);border-top:1px solid var(--cs-line)}.app-dock-head{display:flex;justify-content:space-between;align-items:center}.app-dock-items{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:5px}.app-dock .app-task{padding:8px 10px;border-left:2px solid var(--cs-line)}.app-dock strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.app-rail{width:58px;flex-shrink:0;padding:8px 5px;display:flex;align-items:center;flex-direction:column;gap:12px}.app-circle{border:1px solid var(--cs-line);border-radius:50%;width:40px;height:40px;text-align:center;padding:0;font-weight:600;background:var(--cs-surface)}.app-circle.active{border:2px solid var(--cs-blue);color:var(--cs-blue)}.app-flyout{position:absolute;right:58px;top:8px;width:290px;background:var(--cs-surface);border:1px solid var(--cs-line);border-radius:10px;box-shadow:0 10px 30px #202b3b20;z-index:3;padding:14px}.app-flyout h2{font-size:16px;margin-bottom:10px}.app-unified{width:245px;flex-shrink:0;overflow:auto;padding:12px}.app-unified h2{font-size:14px;padding:8px 12px}.app-unified .app-task{padding:10px 12px}.app-divider{border-top:1px solid var(--cs-line);margin-top:16px;padding-top:12px}.app-overview{background:var(--cs-surface);flex:1;margin:0 10px 0 0;padding:24px;overflow:auto;border-radius:12px}.app-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:24px}.app-column h2{font-size:15px;margin-bottom:14px}.app-column .app-task{border:1px solid var(--cs-line);margin-bottom:12px;padding:18px;border-radius:8px}.app-column .app-task p{color:var(--cs-muted);font-size:13px}.app-back{color:var(--cs-blue)}dialog{border:1px solid var(--cs-line);border-radius:12px;padding:20px;width:580px;max-width:calc(100% - 32px);color:var(--cs-ink);box-shadow:0 20px 80px #202b3b30}dialog::backdrop{background:#202b3b38}dialog input{width:100%;padding:12px;border:1px solid var(--cs-line);border-radius:6px;margin:14px 0}dialog .app-task{border-bottom:1px solid var(--cs-line)}.app-empty{padding:24px;color:var(--cs-muted)}[hidden]{display:none!important}@media(max-width:900px){.app-files{width:165px}.app-dock-items{grid-template-columns:repeat(3,minmax(0,1fr))}.app-terminal{padding:20px}.app-heading small{display:none}.app-board{gap:10px}.app-unified{width:210px}}@media(max-width:600px){.app-review{padding:16px}.app-options{gap:6px}.app-options button{padding:8px 10px}.app-meta{padding:12px 16px;display:block}.app-meta .app-muted{display:none}.app-window{margin:0 8px 12px;min-height:640px;height:calc(100vh - 265px)}.app-top{gap:8px;padding:0 10px}.app-brand{margin:0}.app-top .app-muted{display:none}.app-files{display:none}.app-terminal{padding:16px}.app-tabs span{padding:10px}.app-terminal td,.app-terminal th{padding:8px 4px;font-size:12px}.app-dock-items{grid-template-columns:repeat(2,minmax(0,1fr))}.app-unified{width:138px;padding:5px}.app-unified small{font-size:11px}.app-unified .app-task{padding:8px}.app-unified .app-file{padding:6px}.app-board{grid-template-columns:1fr}.app-overview{padding:16px;margin:0}.app-status{gap:8px;font-size:11px}.app-flyout{width:min(290px,calc(100% - 64px))}.app-meta p{font-size:13px}h1{font-size:20px}}
@media(max-width:600px){.app-tabs span:not(.current){display:none}.app-main:has(.app-unified){flex-direction:column}.app-unified{width:100%;max-height:210px;border-bottom:1px solid var(--cs-line)}.app-unified .app-divider{display:none}}
</style>
<header class="app-review"><div class="app-heading"><h1>把空间还给工作</h1><small>Krosna / 任务监控结构探索 · 交互原型</small></div><nav class="app-options" aria-label="选择结构方案" id="options"></nav></header>
<section class="app-meta"><div><b id="concept"></b><p id="description"></p></div><span class="app-muted" id="tradeoff"></span></section>
<main class="app-window" id="window"></main>
<dialog id="picker" aria-labelledby="pickerTitle"><div class="app-heading"><h2 id="pickerTitle">跳转到任务</h2><button id="close">关闭 · Esc</button></div><input id="search" aria-label="搜索任务或项目" placeholder="搜索任务、项目或智能体…"><div id="results"></div></dialog>
<script>
// 演示数据仅用于原型，未连接实际任务状态。
const tasks=[{name:'核实催审漏发漏洞',project:'renmin',agent:'Codex',state:'done',detail:'已完成漏洞核查，等待审阅结果。'},{name:'人民平台论文登记功能开发',project:'renmin',agent:'Gemini',state:'done',detail:'已统一验收材料，整理了交付时间线。'},{name:'分析才能问题',project:'Termflow',agent:'Claude',state:'wait',detail:'需要确认复现步骤和预期行为。'},{name:'Termflow 项目开发会话',project:'Termflow',agent:'Codex',state:'done',detail:'实现已完成，可以查看本次改动。'},{name:'远程工作区界面重构',project:'Termflow',agent:'Claude',state:'done',detail:'远程工作区布局已更新。'},{name:'修正图标匹配',project:'Termflow',agent:'Codex',state:'run',detail:'正在检查文件类型与图标映射。'}];
const states={done:'已完成',wait:'待回应',run:'运行中'};
const designs=[['底部任务舱','横向停靠 · 保留全局感知','任务沿底部展开，终端保持完整宽度。点击任务切换，收起后只留状态摘要。','取舍：占用少量垂直空间'],['窄轨展开','右侧窄轨 · 保留位置记忆','常驻一列圆形任务入口，点击展开详情，再进入对应会话。','取舍：长标题需展开查看'],['顶部任务菜单','按需唤起 · 最大工作面积','所有任务收进顶部入口。按 Ctrl / ⌘ + K 搜索，选择后回到工作。','取舍：任务列表不再常驻'],['左侧统一导航','合并导航 · 项目作为唯一入口','会话和文件放在同一个项目上下文中，右侧完全交给内容。','取舍：文件与会话共用左栏'],['全屏任务总览','工作 / 调度双视图 · 按状态分流','调度时按待回应、运行中、已完成查看；进入任务后使用完整工作区。','取舍：总览与内容需要切换']];
let mode=Number(new URLSearchParams(location.search).get('mode')||0);if(mode<0||mode>4)mode=0;let selected=1,expanded=true,fly=-1,overview=true;
const $=id=>document.getElementById(id);const count=s=>tasks.filter(t=>t.state===s).length;
function task(i,extra=''){const t=tasks[i];return `<button class="app-task ${i===selected?'active':''}" data-task="${i}"><strong><span class="app-dot ${t.state==='wait'?'wait':''}"></span>${t.name}</strong><small>${t.project} · ${t.agent} · ${states[t.state]}</small>${extra}</button>`}
function files(){return `<aside class="app-files"><h2>renmin <span class="app-muted">/ 文件</span></h2>${['⌄ file','⌄ 05_伦理审查服务','⌄ 伦理-验收材料-终','项目实施计划.doc','培训及签到表.docx','数据库结构.xlsx','系统功能实现.docx','用户意见确认单.docx','项目完工报告.doc','系统验收报告.doc','项目维护方案.doc','归档说明.md'].map((x,i)=>`<div class="app-file ${i>2?'indent':''} ${i===3?'selected':''}">${x}</div>`).join('')}</aside>`}
function work(){const t=tasks[selected];return `<section class="app-work"><div class="app-tabs"><span class="current">${t.agent} / 当前会话</span><span>项目维护方案.doc</span></div><article class="app-terminal"><div class="app-muted">${t.project} / ${t.name}</div><div class="app-prompt">${selected===1?'你把相关的时间说明一下。':t.name}</div><h2>${selected===1?'验收材料的时间线已整理':t.name}</h2><p>${t.detail}</p><p>当前项目的相关文件与会话上下文已保留。你可以继续查看结果，或从任务导航切换到其他会话。</p><table><thead><tr><th>日期 / 阶段</th><th>事项</th><th>对应材料</th></tr></thead><tbody><tr><td>06-29</td><td>合同签署与项目启动</td><td>项目实施方案</td></tr><tr><td>07-05 — 07-16</td><td>需求确认与设计</td><td>需求规格说明书</td></tr><tr><td>07-26</td><td>安装、部署与培训</td><td>培训及签到表</td></tr><tr><td>07-29</td><td>开发交付与初验</td><td>项目完工报告</td></tr><tr><td>08-31</td><td>提交终验申请</td><td>终验申请表</td></tr></tbody></table><p><b>仍需关注</b></p><p>两份文件保留了早期日期，建议在提交前统一核对。</p><p><code>file / 05_伦理审查服务 / 伦理-验收材料-终</code></p><div class="app-composer">› 继续当前会话… <small>（内容区域为示意）</small></div></article></section>`}
function render(){ $('options').innerHTML=designs.map((d,i)=>`<button data-mode="${i}" aria-pressed="${mode===i}">${d[0]}</button>`).join('');$('concept').textContent=designs[mode][1];$('description').textContent=designs[mode][2];$('tradeoff').textContent=designs[mode][3];let content='';if(mode===4&&overview){content=`<section class="app-overview"><div class="app-heading"><div><h2>任务总览</h2><p class="app-muted">2 个项目 · ${tasks.length} 个会话 · 先处理需要你回应的任务</p></div><button class="app-back" data-return>返回当前会话 →</button></div><div class="app-board">${['wait','run','done'].map(s=>`<section class="app-column"><h2>${states[s]} · ${count(s)}</h2>${tasks.map((t,i)=>t.state===s?task(i,`<p>${t.detail}</p>`):'').join('')}</section>`).join('')}</div></section>`}else{content=(mode===3?`<aside class="app-unified"><h2>项目与会话</h2>${['renmin','Termflow'].map(p=>`<h2>${p}</h2>${tasks.map((t,i)=>t.project===p?task(i):'').join('')}`).join('')}<div class="app-divider"><h2>当前项目文件</h2><div class="app-file">⌄ 验收材料</div><div class="app-file">项目实施计划.doc</div><div class="app-file">项目维护方案.doc</div></div></aside>`:files())+work();if(mode===1)content+=`<aside class="app-rail" aria-label="任务窄轨">${tasks.map((t,i)=>`<button class="app-circle ${selected===i?'active':''}" data-fly="${i}" title="${t.name} · ${states[t.state]}" aria-label="${t.name} · ${states[t.state]}">${t.agent.slice(0,2)}</button>`).join('')}</aside>${fly>=0?`<aside class="app-flyout"><div class="app-heading"><h2>${tasks[fly].project}</h2><button data-dismiss aria-label="关闭详情">×</button></div>${task(fly,`<p>${tasks[fly].detail}</p><span class="app-back">进入会话 →</span>`)}</aside>`:''}`}
$('window').innerHTML=`<header class="app-top"><div class="app-brand"><span>⌘</span> Krosna</div><span class="app-muted">${tasks[selected].project}</span><span class="app-spacer"></span>${mode===2?`<button data-picker>任务 ${tasks.length} · ${count('wait')} 待回应 <small>Ctrl K</small></button>`:mode===4?'<button data-overview>任务总览 ↗</button>':'<span class="app-muted">本地工作区</span>'}</header><div class="app-main">${content}</div>${mode===0?`<section class="app-dock"><div class="app-dock-head"><b>任务 · ${count('wait')} 待回应 · ${count('run')} 运行中 · ${count('done')} 已完成</b><button data-collapse>${expanded?'收起 ↓':'展开 ↑'}</button></div>${expanded?`<div class="app-dock-items">${tasks.map((_,i)=>task(i)).join('')}</div>`:''}</section>`:''}<footer class="app-status"><span><span class="app-dot"></span>本地已连接</span><span class="app-spacer"></span><span>演示数据</span><span>${tasks[selected].agent}</span></footer>`}
function results(){const q=$('search').value.toLowerCase();const matches=tasks.map((t,i)=>({...t,i})).filter(t=>(t.name+t.project+t.agent).toLowerCase().includes(q));$('results').innerHTML=matches.length?matches.map(t=>task(t.i)).join(''):'<p class="app-empty">没有找到匹配的任务。</p>'}
function openPicker(){results();$('picker').showModal();$('search').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode!==undefined){mode=+b.dataset.mode;overview=true;fly=-1;history.replaceState(null,'',`?mode=${mode}`)}else if(b.dataset.task!==undefined){selected=+b.dataset.task;overview=false;fly=-1;if($('picker').open)$('picker').close()}else if(b.hasAttribute('data-collapse'))expanded=!expanded;else if(b.dataset.fly!==undefined)fly=fly===+b.dataset.fly?-1:+b.dataset.fly;else if(b.hasAttribute('data-dismiss'))fly=-1;else if(b.hasAttribute('data-picker')){openPicker();return}else if(b.hasAttribute('data-overview'))overview=true;else if(b.hasAttribute('data-return'))overview=false;else return;render()});$('close').onclick=()=>$('picker').close();$('search').oninput=results;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPicker()}if(e.key==='Escape'&&fly>=0){fly=-1;render()}});render();
</script>
</html>
