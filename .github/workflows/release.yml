name: Release Krosna

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to mirror for legacy clients (for example, v1.8.35)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        run: corepack pnpm install --frozen-lockfile --store-dir "$env:RUNNER_TEMP\pnpm-store"

      - name: Verify release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersionMatch = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if ($null -eq $cargoVersionMatch) {
            throw "Unable to read the package version from src-tauri/Cargo.toml."
          }
          $cargoVersion = $cargoVersionMatch.Matches[0].Groups[1].Value
          if ($tagVersion -ne $packageVersion -or $tagVersion -ne $tauriVersion -or $tagVersion -ne $cargoVersion) {
            throw "Tag ${{ github.ref_name }} does not match package.json ($packageVersion), tauri.conf.json ($tauriVersion), and Cargo.toml ($cargoVersion)."
          }

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Krosna v__VERSION__
          generateReleaseNotes: true
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Generate updater manifest
        shell: pwsh
        run: |
          $releaseNotesPath = "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $releaseNotesPath)) {
            throw "Missing curated release notes: $releaseNotesPath"
          }
          corepack pnpm update:manifest `
            --notes-file $releaseNotesPath

      - name: Replace release updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" output/updates/latest.json --clobber

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes-file "release-notes/${{ github.ref_name }}.md" --draft=false --latest

  # Only old clients use this domain. New clients update directly from GitHub.
  # Preserve the deployed server's legacy staging path, script and asset alias.
  legacy-update-bridge:
    needs: release-windows
    if: ${{ always() && ((startsWith(github.ref, 'refs/tags/v') && needs.release-windows.result == 'success') || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - name: Download signed GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid release tag" }
          $version = $tag -replace '^v', ''
          $assets = Join-Path $env:RUNNER_TEMP "krosna-legacy-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          gh release download $tag --repo $env:RELEASE_REPOSITORY --pattern latest.json --dir $assets
          if ($LASTEXITCODE -ne 0) { throw "Unable to download release manifest" }
          $manifest = Get-Content -Raw (Join-Path $assets latest.json) | ConvertFrom-Json
          $platform = $manifest.platforms.'windows-x86_64'
          if ($manifest.version -ne $version -or [string]::IsNullOrWhiteSpace($platform.signature)) {
            throw "Manifest version or Windows signature is invalid"
          }
          $artifactName = [uri]::UnescapeDataString(([uri]$platform.url).Segments[-1])
          if ($artifactName -notmatch '^(Krosna|Termflow)_[0-9A-Za-z.+-]+_x64-setup\.exe$') { throw "Unexpected installer name" }
          gh release download $tag --repo $env:RELEASE_REPOSITORY --pattern $artifactName --pattern "${artifactName}.sig" --dir $assets
          if ($LASTEXITCODE -ne 0) { throw "Unable to download signed installer" }
          $signature = (Get-Content -Raw (Join-Path $assets "${artifactName}.sig")).Trim()
          if ($signature -ne $platform.signature.Trim()) { throw "Installer signature does not match manifest" }
          $alias = "Termflow_${version}_x64-setup.exe"
          if ($artifactName -ne $alias) {
            Copy-Item -LiteralPath (Join-Path $assets $artifactName) -Destination (Join-Path $assets $alias)
            Copy-Item -LiteralPath (Join-Path $assets "${artifactName}.sig") -Destination (Join-Path $assets "${alias}.sig")
          }
          $platform.url = "https://termflow.jianglan.online/releases/$alias"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $assets server-latest.json) -Encoding utf8
          "LEGACY_ASSETS=$assets" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LEGACY_INSTALLER=$alias" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure legacy bridge SSH access
        shell: pwsh
        env:
          UPDATE_DEPLOY_SSH_KEY: ${{ secrets.UPDATE_DEPLOY_SSH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_DEPLOY_SSH_KEY)) { throw "UPDATE_DEPLOY_SSH_KEY is not configured" }
          $keyPath = Join-Path $env:RUNNER_TEMP "krosna-update-deploy"
          [System.IO.File]::WriteAllText($keyPath, $env:UPDATE_DEPLOY_SSH_KEY.Trim() + "`n", [System.Text.UTF8Encoding]::new($false))
          icacls $keyPath /inheritance:r /grant:r "${env:USERNAME}:R" | Out-Null

      - name: Mirror release for legacy clients
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "krosna-update-deploy"
          $knownHosts = Join-Path $env:RUNNER_TEMP "krosna-update-known-hosts"
          $destination = "ubuntu@119.29.73.208"
          $staging = "/home/ubuntu/termflow-update-staging"
          $sshOptions = @("-i", $keyPath, "-o", "StrictHostKeyChecking=accept-new", "-o", "UserKnownHostsFile=$knownHosts")
          ssh @sshOptions $destination "mkdir -p $staging && rm -f $staging/Termflow_*_x64-setup.exe $staging/Termflow_*_x64-setup.exe.sig $staging/latest.json $staging/server-latest.json"
          if ($LASTEXITCODE -ne 0) { throw "Unable to prepare legacy staging directory" }
          scp @sshOptions "$env:LEGACY_ASSETS/$env:LEGACY_INSTALLER" "$env:LEGACY_ASSETS/$env:LEGACY_INSTALLER.sig" "$env:LEGACY_ASSETS/server-latest.json" "${destination}:${staging}/"
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload legacy update" }
          ssh @sshOptions $destination "mv $staging/server-latest.json $staging/latest.json && sudo /usr/local/sbin/deploy-termflow-update"
          if ($LASTEXITCODE -ne 0) { throw "Unable to deploy legacy update" }

      - name: Remove temporary SSH key
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "krosna-update-deploy") -Force -ErrorAction SilentlyContinue
